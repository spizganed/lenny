[package]
name = "lenny_vcam"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "IVirtualCamera: the OS virtual camera behind one trait. v4l2loopback on Linux, null (file) backend anywhere."
license = "UNLICENSED"
publish = false

[dependencies]
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
lenny_framebuf = { path = "../framebuf" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
] }
