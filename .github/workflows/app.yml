name: app

on:
  push:
    paths: ["app/**", "plugins/**", "core/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "plugins/**", "core/**", ".github/workflows/app.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Analyze + widget tests
        working-directory: app
        run: flutter analyze && flutter test
      - name: Build APK (cargo-ndk builds the Rust core from Gradle)
        working-directory: app
        run: flutter build apk --debug
      - name: JVM unit tests (camera math)
        working-directory: app/android
        run: ./gradlew :android_camera:testDebugUnitTest
