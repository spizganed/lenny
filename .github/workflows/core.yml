name: core

on:
  push:
    paths: ["core/**", "vcam/**", "desktop/**", "protocol/**", "Cargo.*", "rustfmt.toml", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "vcam/**", "desktop/**", "protocol/**", "Cargo.*", "rustfmt.toml", ".github/workflows/core.yml"]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - name: Desktop build deps
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: C ABI matches include/lenny/lenny.h (cbindgen)
        run: core/tools/abi_check.sh
      - name: C ABI end-to-end test (C++ caller, ASan/UBSan)
        run: |
          cargo build --release -p lenny_core
          g++ -std=c++20 -g -fsanitize=address,undefined -fno-omit-frame-pointer -Icore/include \
            core/tests/c_abi/*.cpp target/release/liblenny_core.a -lpthread -ldl -o c_abi_tests
          ./c_abi_tests
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (x64; includes the virtual cameras driven in-process)
        run: cargo test --workspace
      - name: Virtual camera DLL tests, x86 (32-bit DirectShow apps)
        run: cargo test -p lenny_vcam_com --target i686-pc-windows-msvc
      - name: regsvr32 register + unregister, x64 and x86
        shell: pwsh
        run: |
          cargo build --release -p lenny_vcam_com
          cargo build --release -p lenny_vcam_com --target i686-pc-windows-msvc
          $runs = @(
            @("$env:WINDIR\System32\regsvr32.exe", "target\release\lenny_vcam_com.dll"),
            @("$env:WINDIR\SysWOW64\regsvr32.exe", "target\i686-pc-windows-msvc\release\lenny_vcam_com.dll"))
          foreach ($r in $runs) {
            foreach ($flags in @("/s", "/s /u")) {
              $p = Start-Process $r[0] -ArgumentList "$flags `"$(Resolve-Path $r[1])`"" -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "regsvr32 $flags $($r[1]) failed: $($p.ExitCode)" }
            }
          }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: cargo ndk build
        run: cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o jniLibs build --release -p lenny_core --lib
      - name: SONAME is set (the JNI shim must not link a build path)
        run: $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d jniLibs/arm64-v8a/liblenny_core.so | grep 'SONAME.*liblenny_core.so'
